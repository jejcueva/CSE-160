<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Assignment 0</title>
</head>
<body>
  <canvas id="example" width="400" height="400" style="border: 1px solid black;"></canvas>
  <br/>

  <div>
    <label>v1: x=</label><input type="number" id="v1x" value="2.25" step="0.25" />
    <label>y=</label><input type="number" id="v1y" value="2.25" step="0.25" />
  </div>
  <div>
    <label>v2: x=</label><input type="number" id="v2x" value="0" step="0.25" />
    <label>y=</label><input type="number" id="v2y" value="0" step="0.25" />
  </div>
  <div>
    <input type="button" value="Draw" onclick="handleDrawEvent()" />
  </div>
  <br/>

  <div>
    <label>Operation:</label>
    <select id="op-select">
      <option value="add">Add</option>
      <option value="sub">Subtract</option>
      <option value="mul">Multiply</option>
      <option value="div">Divide</option>
      <option value="magnitude">Magnitude</option>
      <option value="normalize">Normalize</option>
      <option value="angle">Angle between</option>
      <option value="area">Area</option>
    </select>
    <label>Scalar:</label><input type="number" id="scalar" value="1" step="0.25" />
    <input type="button" value="Draw Operation" onclick="handleDrawOperationEvent()" />
  </div>

  <script src="lib/cuon-matrix-cse160.js"></script>
  <script src="asg0.js"></script>
</body>
</html>
